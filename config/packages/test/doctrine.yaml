doctrine:
    dbal:
        # keep the same driver and server as in .env
        driver: 'pdo_mysql'
        server_version: '10.4.32-MariaDB'
        charset: utf8mb4

        # ⚠️ Important: don't add "_test" again to avoid "easy_peasy_test_test"
        url: '%env(resolve:DATABASE_URL)%'

        # Optional: comment or remove this line if it appears elsewhere
        # dbname_suffix: '_test%env(default::TEST_TOKEN)%'

    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
